<h1>REGISTER FORM</h1>
<ul>
{%if errors%}
 {%for e in errors%}
  <li>{{e}}</li>
  {%endfor%}
{%endif%}</ul>
<form method="post">
<label>Full Name:</label>
<input name="name" type="text">
<label>Email:</label>
<input name="email" type="email">
<label>Password:</label>
<input name="password" type="password">
<label>Role:</label>
<input name="role" type="text">
<button type="submit">Register</button>
</form>
